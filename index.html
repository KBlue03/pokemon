<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Pokemon六星叫聲辨識</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      background: #f9fafb;
      padding: 40px 20px;
    }

    h1 {
      color: #333;
      font-size: 2em;
      margin-bottom: 10px;
    }

    button {
      background-color: #4f46e5;
      color: white;
      padding: 12px 24px;
      font-size: 16px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      margin: 20px 0;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #4338ca;
    }

    #label-container {
      max-width: 400px;
      margin: 0 auto;
      text-align: left;
    }

    .label-box {
      margin-bottom: 12px;
    }

    .label-text {
      font-weight: bold;
      margin-bottom: 4px;
    }

    .progress-bar {
      width: 100%;
      height: 16px;
      background-color: #e5e7eb;
      border-radius: 8px;
      overflow: hidden;
    }

    .progress {
      height: 100%;
      background-color: #3b82f6;
      width: 0%;
      transition: width 0.3s;
    }
  </style>
</head>
<body>
  <h1>🎤 Teachable Machine 聲音辨識</h1>
  <button onclick="init()">開始辨識</button>
  <div id="label-container"></div>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/ft3fr1imo/";

    async function createModel() {
      const checkpointURL = URL + "model.json";
      const metadataURL = URL + "metadata.json";

      const recognizer = speechCommands.create("BROWSER_FFT", undefined, checkpointURL, metadataURL);
      await recognizer.ensureModelLoaded();
      return recognizer;
    }

    async function init() {
      const recognizer = await createModel();
      const classLabels = recognizer.wordLabels();
      const labelContainer = document.getElementById("label-container");
      labelContainer.innerHTML = "";

      for (let i = 0; i < classLabels.length; i++) {
        const box = document.createElement("div");
        box.className = "label-box";

        const text = document.createElement("div");
        text.className = "label-text";
        text.innerText = classLabels[i];

        const bar = document.createElement("div");
        bar.className = "progress-bar";

        const fill = document.createElement("div");
        fill.className = "progress";
        fill.id = `bar-${i}`;

        bar.appendChild(fill);
        box.appendChild(text);
        box.appendChild(bar);
        labelContainer.appendChild(box);
      }

      recognizer.listen(result => {
        const scores = result.scores;
        for (let i = 0; i < classLabels.length; i++) {
          const percent = (scores[i] * 100).toFixed(1);
          const fill = document.getElementById(`bar-${i}`);
          fill.style.width = `${percent}%`;
        }
      }, {
        includeSpectrogram: true,
        probabilityThreshold: 0.5,
        invokeCallbackOnNoiseAndUnknown: true,
        overlapFactor: 0.5
      });
    }
  </script>
</body>
</html>
