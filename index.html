<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teachable Machine Audio Model</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
    <style>
        body {
            font-family: 'Segoe UI', sans-serif;
            text-align: center;
            padding: 40px;
            background: linear-gradient(to right, #74ebd5, #acb6e5);
            color: #333;
        }
        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }
        #label-container div {
            font-size: 1.25em;
            margin: 10px auto;
            padding: 10px;
            width: 60%;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }
        #alert-box {
            margin-top: 30px;
            padding: 15px;
            font-size: 1.5em;
            background-color: #fffae6;
            border-left: 8px solid #f0c000;
            width: 80%;
            margin-left: auto;
            margin-right: auto;
            display: none;
        }
        button {
            font-size: 1.2em;
            padding: 10px 30px;
            border-radius: 10px;
            border: none;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>
    <h1>Pokemon叫聲識別</h1>
    <button onclick="init()">開始辨識</button>
    <div id="label-container"></div>
    <div id="alert-box"></div>

    <script>
        const URL = "https://teachablemachine.withgoogle.com/models/ft3fr1imo/";
        const customLabels = [
            "蒼響", "妙蛙花", "藏瑪然特", "密勒頓", "超夢", "夢幻",
            "巨金怪", "班基拉斯", "噴火龍", "水箭龜"
        ];

        async function createModel() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            const recognizer = speechCommands.create("BROWSER_FFT", undefined, checkpointURL, metadataURL);
            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const labelContainer = document.getElementById("label-container");
            const alertBox = document.getElementById("alert-box");

            labelContainer.innerHTML = "";
            for (let i = 0; i < customLabels.length; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            recognizer.listen(result => {
                let maxScore = 0;
                let bestLabel = "";

                for (let i = 0; i < customLabels.length; i++) {
                    const score = result.scores[i];
                    labelContainer.childNodes[i].innerHTML = `${customLabels[i]}: ${score.toFixed(2)}`;

                    if (score > maxScore) {
                        maxScore = score;
                        bestLabel = customLabels[i];
                    }
                }

                if (maxScore > 0.85) {
                    alertBox.style.display = "block";
                    alertBox.innerText = `⚡ 偵測到六星：「${bestLabel}」的機率為 ${(maxScore * 100).toFixed(1)}%！`;
                } else {
                    alertBox.style.display = "none";
                }

            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.75,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.5
            });
        }
    </script>
</body>
</html>
